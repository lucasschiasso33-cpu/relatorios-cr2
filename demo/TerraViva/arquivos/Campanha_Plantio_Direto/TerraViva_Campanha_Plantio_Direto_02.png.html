<style>

  .fmt{display:inline-block;background:#2563EB;color:#fff;font-size:11px;font-weight:bold;padding:3px 10px;border-radius:4px;margin-bottom:24px}
  .img-demo,.pdf-demo,.video-demo{width:100%;max-width:560px}
  .img-placeholder{background:#1E3A5F;border-radius:10px;padding:30px;display:flex;align-items:center;justify-content:center}

  .line{background:linear-gradient(90deg,#2563EB,#22C55E);height:18px;width:100%;border-radius:4px;opacity:0.7}
  .img-text{font-size:16px;color:#fff;font-weight:bold;margin-top:10px;text-align:center}
  .pdf-page{background:#fff;color:#333;border-radius:8px;padding:28px;max-width:400px;margin:0 auto}

  .pdf-line{height:10px;background:#E2E8F0;border-radius:4px;margin-bottom:8px}
  .pdf-line.short{width:70%}
  .pdf-line.shorter{width:50%}
  .pdf-body{font-size:13px;color:#64748B;margin-top:16px;font-style:italic}
  .video-player{background:#111;border-radius:10px;padding:40px 30px;display:flex;flex-direction:column;align-items:center;gap:16px;max-width:400px;margin:0 auto}
  .play-btn{font-size:48px;opacity:0.8}
  .video-bar{width:100%;background:#333;border-radius:4px;height:6px}
  .video-progress{width:35%;background:#2563EB;height:6px;border-radius:4px}
  .video-time{font-size:12px;color:#94A3B8}
  .demo-label{font-size:12px;color:#64748B;margin-top:12px;text-align:center;font-style:italic}
  .rodape{margin-top:32px;font-size:11px;color:#374151}
