<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Lançamento Linha Orgânica — DEMO</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:Arial,sans-serif;background:#0D1B2A;color:#fff;min-height:100vh;padding:36px 20px}
  .header{text-align:center;margin-bottom:28px}
  .badge{background:#F59E0B;color:#000;font-size:10px;font-weight:bold;padding:3px 10px;border-radius:20px;letter-spacing:2px;display:inline-block;margin-bottom:10px}
  .logo{font-size:11px;color:#94A3B8;letter-spacing:3px;text-transform:uppercase;margin-bottom:6px}
  h1{font-size:21px;color:#fff;margin-bottom:4px}
  .empresa{font-size:13px;color:#2563EB}
  .lista{width:100%;max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
  .arquivo{display:flex;align-items:center;gap:12px;background:#1A3A5C;padding:13px 16px;border-radius:8px;cursor:pointer;transition:background .2s}
  .arquivo:hover{background:#2563EB}
  .num{font-size:11px;color:#94A3B8;min-width:22px}
  .nome{flex:1;font-size:14px}
  .ext{font-size:10px;background:#0D1B2A;color:#94A3B8;padding:2px 7px;border-radius:3px}
  .btn{font-size:11px;background:#2563EB;color:#fff;padding:4px 12px;border-radius:4px;min-width:44px;text-align:center}
  .arquivo:hover .btn{background:#fff;color:#2563EB}
  .preview{display:none;background:#111;padding:12px;border-radius:0 0 8px 8px;margin-top:-4px}
  .preview.open{display:block}
  .rodape{text-align:center;margin-top:28px;font-size:11px;color:#374151}
</style>
</head>
<body>
  <div class="header">
    <div class="badge">⚡ DEMONSTRAÇÃO</div>
    <div class="logo">NEXUS Marketing</div>
    <h1>Lançamento Linha Orgânica</h1>
    <div class="empresa">TerraViva Agro</div>
  </div>
  <div class="lista">
        <div class="arquivo-wrap">
          <div class="arquivo" onclick="toggle('arq1')">
            <span class="num">01</span>
            <span class="nome">TerraViva_Lancamento_Linha_Organica_01.png</span>
            <span class="ext">PNG</span>
            <span class="btn" id="btnarq1">Ver</span>
          </div>
          <div class="preview" id="prevarq1">
            <iframe src="https://relatorioscr2marketing.bluemindperformance.com.br/demo/TerraViva/arquivos/Lancamento_Linha_Organica/TerraViva_Lancamento_Linha_Organica_01.png.html" style="width:100%;height:75vh;border:none;border-radius:6px;"></iframe>
          </div>
        </div>
        <div class="arquivo-wrap">
          <div class="arquivo" onclick="toggle('arq2')">
            <span class="num">02</span>
            <span class="nome">TerraViva_Lancamento_Linha_Organica_02.png</span>
            <span class="ext">PNG</span>
            <span class="btn" id="btnarq2">Ver</span>
          </div>
          <div class="preview" id="prevarq2">
            <iframe src="https://relatorioscr2marketing.bluemindperformance.com.br/demo/TerraViva/arquivos/Lancamento_Linha_Organica/TerraViva_Lancamento_Linha_Organica_02.png.html" style="width:100%;height:75vh;border:none;border-radius:6px;"></iframe>
          </div>
        </div>
        <div class="arquivo-wrap">
          <div class="arquivo" onclick="toggle('arq3')">
            <span class="num">03</span>
            <span class="nome">TerraViva_Lancamento_Linha_Organica_03.png</span>
            <span class="ext">PNG</span>
            <span class="btn" id="btnarq3">Ver</span>
          </div>
          <div class="preview" id="prevarq3">
            <iframe src="https://relatorioscr2marketing.bluemindperformance.com.br/demo/TerraViva/arquivos/Lancamento_Linha_Organica/TerraViva_Lancamento_Linha_Organica_03.png.html" style="width:100%;height:75vh;border:none;border-radius:6px;"></iframe>
          </div>
        </div></div>
  <div class="rodape">Relatório de Entregas — Março 2026 · DEMO</div>
<script>
  function toggle(uid){
    var p=document.getElementById("prev"+uid),b=document.getElementById("btn"+uid);
    if(!p)return;
    var o=p.classList.toggle("open");
    b.textContent=o?"Fechar":"Ver";
  }
</script>
</body>
</html>
