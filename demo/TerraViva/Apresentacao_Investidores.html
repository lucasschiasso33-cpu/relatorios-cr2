<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Apresentação Investidores</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;background:#0D1B2A;color:#fff;min-height:100vh;padding:36px 20px}.header{text-align:center;margin-bottom:28px}.logo{font-size:11px;color:#94A3B8;letter-spacing:3px;text-transform:uppercase;margin-bottom:6px}h1{font-size:21px;color:#fff;margin-bottom:4px}.empresa{font-size:13px;color:#2563EB}.lista{width:100%;max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:8px}.arquivo{display:flex;align-items:center;gap:12px;background:#1A3A5C;padding:13px 16px;border-radius:8px;cursor:pointer;transition:background .2s;user-select:none}.arquivo:hover{background:#2563EB}.num{font-size:11px;color:#94A3B8;min-width:22px}.nome{flex:1;font-size:14px;word-break:break-all}.ext{font-size:10px;background:#0D1B2A;color:#94A3B8;padding:2px 7px;border-radius:3px}.btn{font-size:11px;background:#2563EB;color:#fff;padding:4px 12px;border-radius:4px;min-width:44px;text-align:center}.arquivo:hover .btn{background:#fff;color:#2563EB}.preview{display:none;background:#111;padding:14px;border-radius:0 0 8px 8px;margin-top:-4px}.preview.open{display:block}.rodape{text-align:center;margin-top:28px;font-size:11px;color:#374151}</style></head>
